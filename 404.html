<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | CABANA</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #f5f5f7;
        color: #1d1d1f;
      }
      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: min(560px, 100%);
        border: 1px solid #d2d2d7;
        border-radius: 18px;
        background: #fff;
        padding: 28px;
      }
      h1 {
        margin: 0;
        font-size: 28px;
      }
      p {
        margin: 12px 0 0;
        color: #6e6e73;
        line-height: 1.5;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 20px;
      }
      a {
        text-decoration: none;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        font-size: 11px;
        border-radius: 999px;
        padding: 12px 16px;
      }
      .primary {
        background: #1d1d1f;
        color: #fff;
      }
      .secondary {
        border: 1px solid #d2d2d7;
        color: #6e6e73;
      }
    </style>
  </head>
  <body>
    <main>
      <article class="card" role="status" aria-live="polite">
        <h1>Page not found</h1>
        <p>The page you’re looking for has moved, expired, or is unavailable.</p>
        <div class="actions">
          <a class="primary" href="/">Back to home</a>
          <a class="secondary" href="/products">Shop products</a>
        </div>
      </article>
    </main>
  </body>
</html>
