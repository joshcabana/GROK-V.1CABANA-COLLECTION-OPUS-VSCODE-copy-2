<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline | Cabana Collections</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #f5f5f7;
        color: #1d1d1f;
      }
      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        text-align: center;
      }
      .card {
        max-width: 560px;
        border: 1px solid #d2d2d7;
        border-radius: 18px;
        background: #fff;
        padding: 1.75rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.75rem;
        letter-spacing: 0.01em;
      }
      p {
        margin: 0;
        color: #6e6e73;
      }
      a {
        display: inline-block;
        margin-top: 1rem;
        color: #1d1d1f;
        text-decoration: none;
        border: 1px solid #d2d2d7;
        border-radius: 999px;
        padding: 0.65rem 1rem;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.18em;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <h1>You're offline</h1>
        <p>Please reconnect to continue shopping Cabana Collections.</p>
        <a href="/">Try again</a>
      </div>
    </main>
  </body>
</html>
