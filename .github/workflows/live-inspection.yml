name: Live Inspection

on:
  schedule:
    - cron: '0 0 * * 2'
    - cron: '0 0 * * 5'
  workflow_dispatch:

jobs:
  inspect-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run live inspection
        env:
          CABANA_PREVIEW_URL: ${{ secrets.CABANA_PREVIEW_URL }}
          CABANA_PROMOTED_URL: ${{ secrets.CABANA_PROMOTED_URL }}
          CABANA_INSPECT_ALLOW_EMPTY: '1'
        run: pnpm run inspect:live

      - name: Run visual inspection
        env:
          CABANA_PREVIEW_URL: ${{ secrets.CABANA_PREVIEW_URL }}
          CABANA_PROMOTED_URL: ${{ secrets.CABANA_PROMOTED_URL }}
          CABANA_INSPECT_ALLOW_EMPTY: '1'
        run: pnpm run inspect:visual

      - name: Upload inspection artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-inspection-report
          path: |
            reports/releases/live-inspection.latest.*
            reports/releases/visual-inspection.latest.*
            reports/releases/visual/
          if-no-files-found: warn
