<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CABANA | Offline</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #f6f3ef;
        color: #1a1a1a;
        padding: 24px;
      }
      main {
        max-width: 560px;
        background: #fff;
        border: 1px solid #e8dfd5;
        border-radius: 18px;
        padding: 28px;
        box-shadow: 0 20px 40px rgba(15, 15, 15, 0.08);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 1.6rem;
        line-height: 1.2;
      }
      p {
        margin: 0;
        color: #575757;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>CABANA could not reach the network. Reconnect to continue browsing the collection.</p>
    </main>
  </body>
</html>
